name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # This is also the check that requirements.txt still resolves, so a broken
      # pin fails here instead of halfway through provisioning a rented GPU.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
