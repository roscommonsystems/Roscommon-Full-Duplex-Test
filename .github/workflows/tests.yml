name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Both files in ONE pip call so the resolver sees requirements.txt's
      # aiohttp ceiling and requirements-dev.txt's pytest-aiohttp pin together.
      # Installing the runtime here is also deliberate: it is the check that
      # requirements.txt still resolves, so a broken pin fails here instead of
      # halfway through provisioning a rented GPU.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
